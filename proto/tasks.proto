syntax = "proto3";

package tasks;


// Контракт сервиса = набор RPC-методов
service TaskService {

  // Unary: 1 запрос -> 1 ответ (аналог GET/POST в REST)

  rpc CreateTask(CreateTaskRequest) returns (Task);
  rpc GetTask(GetTaskRequest) returns (Task);

  // Серверный стриминг: 1 запрос -> поток ответов
  rpc ListTasks(ListTasksRequest) returns (stream Task);

}

message Task {
  int32 id = 1;
  string title = 2;
  string description = 3;

  enum Status {
    OPEN = 0;
    IN_PROGRESS = 1;
    DONE = 2;
  }

  Status status = 4;
}


message GetTaskRequest {
  int32 id = 1;
}

message CreateTaskRequest {
  string title = 1;
  string description = 2;
}

message ListTasksRequest {}
